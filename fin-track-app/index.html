<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal Finance Dashboard Application" />
    <title>FinTrack | Secure Login</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <!-- Top navigation bar for the app -->
      <nav class="navbar">
        <div class="logo">FinTrack</div>
        <!-- This empty list is filled by auth.js based on login state -->
        <ul class="nav-links" id="navLinks"></ul>
      </nav>
    </header>

    <!-- Centered login form area -->
    <main class="auth-container">
      <section class="form-card">
        <h1 id="authTitle">Welcome Back</h1>
        <p id="feedbackMessage" class="hidden"></p>

        <p class="auth-note">Demo login: <a href="mailto:demo@fintrack.com">demo@fintrack.com</a> / fintrack123</p>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="name@example.com" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="6" placeholder="••••••••" />
          </div>

          <button type="submit" class="btn">Sign In</button>
        </form>

        <form id="registerForm" class="hidden" novalidate>
          <div class="form-group">
            <label for="registerName">Full Name</label>
            <input type="text" id="registerName" required placeholder="John Doe" />
          </div>

          <div class="form-group">
            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail" required placeholder="name@example.com" />
          </div>

          <div class="form-group">
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" required minlength="6" placeholder="••••••••" />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••" />
          </div>

          <button type="submit" class="btn">Create Account</button>
        </form>

        <button type="button" id="toggleAuthBtn" class="btn secondary">Need an account? Register</button>
      </section>
    </main>

    <!-- Load the JavaScript that handles login validation and session logic -->
    <script src="js/auth.js"></script>
  </body>
</html>
